{{- range $name, $m := .Values.vllm.models }}
{{- if $m.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $name }}
  labels: {app.kubernetes.io/name: vllm-{{ $name }}, app.kubernetes.io/part-of: nyambika-inference, nyambika.rw/region: {{ $.Values.region | quote }}}
spec:
  replicas: {{ $m.replicas }}
  selector: {matchLabels: {app.kubernetes.io/name: vllm-{{ $name }}}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vllm-{{ $name }}, app.kubernetes.io/part-of: nyambika-inference}
    spec:
      nodeSelector: {{- toYaml $.Values.gpuNodePool.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml $.Values.gpuNodePool.tolerations | nindent 8 }}
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: vllm
          image: {{ $.Values.vllm.image }}
          args:
            - --model={{ $m.repo }}
            - --revision={{ $m.revision }}
            - --served-model-name={{ $m.servedName }}
            - --port=8000
            {{- range $m.args }}
            - {{ . | quote }}
            {{- end }}
          env:
            - {name: HF_HOME, value: /models}
            - {name: VLLM_NO_USAGE_STATS, value: "1"}
            - {name: DO_NOT_TRACK, value: "1"}
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $.Values.modelCache.hfTokenSecret }}, key: token, optional: true}}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 600, periodSeconds: 20}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 90}
          resources:
            limits: {nvidia.com/gpu: {{ $m.gpus }}, memory: {{ $.Values.resources.memoryPerGpu }}}
            requests: {cpu: {{ $.Values.resources.cpuPerGpu | quote }}, memory: {{ $.Values.resources.memoryPerGpu }}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: models, mountPath: /models}, {name: shm, mountPath: /dev/shm}]
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: inference-model-cache}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: vllm-{{ $name }}, labels: {app.kubernetes.io/part-of: nyambika-inference}}
spec:
  selector: {app.kubernetes.io/name: vllm-{{ $name }}}
  ports: [{name: http, port: 80, targetPort: http}]
{{- if $.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: vllm-{{ $name }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: vllm-{{ $name }}}
  minReplicas: {{ max 1 $m.replicas }}
  maxReplicas: {{ $m.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric: {name: DCGM_FI_DEV_GPU_UTIL}
        target: {type: AverageValue, averageValue: {{ $.Values.autoscaling.targetGpuUtilisation | quote }}}
{{- end }}
{{- end }}
{{- end }}
