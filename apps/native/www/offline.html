<!doctype html>
<html lang="rw">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Nyambika · offline</title>
  <style>
    :root { --ink: #0b0a0f; --txt: #f5efe8; --mut: #a79e96; --gold: #f2b84b; --terra: #e0703f; --violet: #8b5cf6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--ink); color: var(--txt); font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
    body {
      display: grid; place-items: center; padding: max(env(safe-area-inset-top), 24px) 20px max(env(safe-area-inset-bottom), 24px);
      background: radial-gradient(60% 40% at 20% 10%, rgba(224,112,63,.35), transparent 70%), radial-gradient(60% 45% at 90% 90%, rgba(139,92,246,.35), transparent 70%), var(--ink);
    }
    main { width: 100%; max-width: 380px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 12px 40px rgba(242,184,75,.25); }
    h1 { font-size: 26px; font-weight: 900; margin: 20px 0 6px; letter-spacing: -.01em; }
    p { margin: 4px 0; color: var(--mut); line-height: 1.45; }
    p[lang="rw"] { color: var(--txt); }
    button {
      margin-top: 24px; width: 100%; min-height: 52px; border: 0; border-radius: 18px; font-size: 17px; font-weight: 700; color: #fff;
      background: linear-gradient(120deg, var(--terra), var(--violet)); box-shadow: 0 10px 30px rgba(139,92,246,.35);
    }
    button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .note { margin-top: 16px; font-size: 13px; }
    @media (prefers-reduced-motion: no-preference) { img { animation: breathe 3s ease-in-out infinite; } }
    @keyframes breathe { 50% { transform: scale(1.04); } }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="" />
    <h1>Nta murandasi</h1>
    <p lang="rw">Reba ko ufite interineti, hanyuma wongere ugerageze.</p>
    <p lang="en">You're offline. Check your connection and try again.</p>
    <p lang="fr">Vous êtes hors ligne. Vérifiez votre connexion et réessayez.</p>
    <button id="retry" type="button">Ongera ugerageze · Try again</button>
    <p class="note">Your twin and looks stay private and encrypted on our servers.</p>
  </main>
  <script src="config.js"></script>
  <script>
    (function () {
      var url = (window.NYAMBIKA && window.NYAMBIKA.serverUrl) || "https://nyambika.rw";
      function retry() { window.location.replace(url + "/"); }
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry);
      try { window.Capacitor && window.Capacitor.Plugins.SplashScreen && window.Capacitor.Plugins.SplashScreen.hide(); } catch (e) {}
    })();
  </script>
</body>
</html>
